            background: none;

            color: #6b7280;

        }

        }

        .tab-content {

        }

                    { year: '2022 World Cup', placement: 'Round of 16', points: 2, weight: 1.3 },
                    { year: '2020 Euro', placement: 'Round of 16', points: 2, weight: 1.1 },
                    { year: '2018 World Cup', placement: 'Round of 16', points: 2, weight: 1.0 },
                    { year: '2016 Euro', placement: 'Semi-final', points: 6, weight: 1.0 },
                    { year: '2014 World Cup', placement: 'Group Stage', points: 0, weight: 1.0 }
                ]
            },
            France: {
                tournaments: [
                    { year: '2022 World Cup', placement: 'Final', points: 8, weight: 1.5 },
                    { year: '2021 Euro', placement: 'Semi-final', points: 6, weight: 1.3 },
                    { year: '2018 World Cup', placement: 'Champion', points: 10, weight: 1.1 },
                    { year: '2016 Euro', placement: 'Final', points: 8, weight: 1.0 },
                    { year: '2014 World Cup', placement: 'Quarter-final', points: 4, weight: 1.0 },
                    { year: '2012 Euro', placement: 'Quarter-final', points: 4, weight: 1.0 }
                ]
            },
            Netherlands: {
                tournaments: [
                    { year: '2024 Euro', placement: 'Semi-final', points: 6, weight: 1.5 },
                    { year: '2022 World Cup', placement: 'Round of 16', points: 2, weight: 1.3 },
                    { year: '2020 Euro', placement: 'Semi-final', points: 6, weight: 1.1 },
                    { year: '2018 World Cup', placement: 'Round of 16', points: 2, weight: 1.0 },
                    { year: '2016 Euro', placement: 'Semi-final', points: 6, weight: 1.0 },
                    { year: '2014 World Cup', placement: 'Semi-final', points: 6, weight: 1.0 }
                ]
            }
        };

        function calculateWeightedIndex(nation) {
            const tournaments = tournamentHistory[nation].tournaments;
            let totalWeightedPoints = 0;
            let totalWeight = 0;
            
            tournaments.forEach(t => {
                totalWeightedPoints += t.points * t.weight;
                totalWeight += t.weight;
            });
            
            return Math.round((totalWeightedPoints / totalWeight) * 10) / 10;
        }

        function getCompetitiveStatus(type) {
            const competitiveTypes = ['WC Qual', 'CONMEBOL', 'Nations League', 'Euro', 'Finals'];
            return competitiveTypes.some(ct => type.includes(ct));
        }

        function renderTeam(nation) {
            const data = matchData[nation];
            const formBadgeClass = `form-badge form-${data.form}`;
            
            let html = `
                <div class="team-card" data-nation="${nation}">
                    <div class="team-header">
                        <span>${nation}</span>
                        <span class="${formBadgeClass}">${data.description}</span>
                    </div>
                    <div class="matches-grid">
            `;
            
            data.matches.forEach(match => {
                const isCompetitive = getCompetitiveStatus(match.type);
                const resultClass = match.result === 'W' ? 'win' : match.result === 'D' ? 'draw' : 'loss';
                const typeClass = isCompetitive ? 'competitive' : 'friendly';
                
                html += `
                    <div class="match-item ${resultClass}">
                        <div class="match-date">${match.date}</div>
                        <div class="match-score">${match.score}</div>
                        <div class="match-opponent">vs ${match.opponent}</div>
                        <div class="match-type ${typeClass}">${match.type}</div>
                    </div>
                `;
            });
            
            html += `</div></div>`;
            return html;
        }

        function filterNation(nation, event) {
            const container = document.getElementById('teamsContainer');
            container.innerHTML = '';
            
            if (nation === 'all') {
                Object.keys(matchData).forEach(n => {
                    container.innerHTML += renderTeam(n);
                });
            } else {
                container.innerHTML = renderTeam(nation);
            }
            
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
            
            if (tabName === 'tournament-index') {
                initIndexTab();
            }
        }

        function initIndexTab() {
            const selector = document.getElementById('indexSelector');
            selector.innerHTML = '';
            
            Object.keys(tournamentHistory).forEach(nation => {
                const btn = document.createElement('button');
                btn.className = 'index-select-btn';
                btn.textContent = nation;
                btn.onclick = () => selectNations(nation, btn);
                selector.appendChild(btn);
            });
            
            const compareAllBtn = document.createElement('button');
            compareAllBtn.className = 'index-select-btn';
            compareAllBtn.textContent = 'Compare All';
            compareAllBtn.onclick = () => selectNations('all', compareAllBtn);
            selector.appendChild(compareAllBtn);
        }

        function selectNations(selection, btn) {
            document.querySelectorAll('.index-select-btn').forEach(b => {
                b.classList.remove('selected');
            });
            btn.classList.add('selected');
            
            const cardsContainer = document.getElementById('comparisonCards');
            cardsContainer.innerHTML = '';
            
            if (selection === 'all') {
                const nations = Object.keys(tournamentHistory).sort((a, b) => calculateWeightedIndex(b) - calculateWeightedIndex(a));
                nations.forEach(nation => {
                    cardsContainer.innerHTML += createIndexCard(nation);
                });
            } else {
                cardsContainer.innerHTML = createIndexCard(selection);
            }
        }

        function createIndexCard(nation) {
            const index = calculateWeightedIndex(nation);
            const tournaments = tournamentHistory[nation].tournaments;
            
            let tournamentsHtml = '';
            tournaments.forEach(t => {
                tournamentsHtml += `
                    <div class="tournament-item">
                        <div>
                            <div class="tournament-year">${t.year}</div>
                            <div class="tournament-placement">${t.placement}</div>
                        </div>
                        <div class="tournament-points">${(t.points * t.weight).toFixed(1)} pts</div>
                    </div>
                `;
            });
            
            return `
                <div class="nation-index-card">
                    <div class="nation-name">${nation}</div>
                    <div class="index-score">${index.toFixed(1)}</div>
                    <div class="score-label">Weighted Tournament Index</div>
                    <div class="tournament-list">
                        ${tournamentsHtml}
                    </div>
                </div>
            `;
        }

        filterNation('all', { target: document.querySelector('.filter-btn') });
    </script>
</body>
</html>
